<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Patchbay">
  <!-- The menu-bar glyph (cmd/patchbay/icon.go, 24-unit grid) on an app tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececef"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="1.5" x2="0" y2="22.5">
      <stop offset="0" stop-color="#2a2a2d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#000000" stroke-opacity="0.10" stroke-width="3"/>
  <g transform="translate(512 512) scale(31) translate(-12 -12)" fill="none" stroke="url(#ink)" stroke-linecap="round">
    <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke-width="1.7"/>
    <path d="M8 8 C8 15 16 9 16 16" stroke-width="1.7"/>
    <g fill="url(#ink)" stroke="none">
      <circle cx="16" cy="8" r="1.5"/>
      <circle cx="8" cy="16" r="1.5"/>
      <circle cx="8" cy="8" r="2.1"/>
      <circle cx="16" cy="16" r="2.1"/>
    </g>
  </g>
</svg>
